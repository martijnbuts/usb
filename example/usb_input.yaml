# ─── USB mouse, keyboard and gamepad for an ESP32-P4 LVGL screen ───────────────────────────────
# Use as a package next to a device config that already has lvgl:
#   packages:
#     usb: !include usb_input.yaml
#
# For the Waveshare ESP32-P4-WIFI6-Touch-LCD-7B: devices go in the Type-A port (USB 2.0 OTG
# High-Speed). Several devices at the same time: a combo receiver (one dongle) or a USB hub (then
# also full_speed_only, see below).
#
# hid comes from the p1ngb4ck fork (upstream ESPHome has no HID support yet), pinned to a commit
# of its dev branch: 9fb8947 (3 Nov 2026). usb_host comes from this repo: the fork's usb_host of
# that commit with espressif/usb 1.6.1 instead of 1.4.1 (unplugging no longer reboots the P4).
# usb_hid comes from this repo too: the fork's copy of that commit with a fix for devices that stop
# after a read error (see the README, Troubleshooting). lvgl_usb_hid (this repo) connects them to
# upstream ESPHome's lvgl. One usb_hid entry serves every HID device that is plugged in.
#
# STATUS: compiled and running on the Waveshare 7B, ESPHome 2026.12.0-dev with ESP-IDF 6.1.1
# (21 Nov 2026).
#
# Keyboard shortcuts for automations go in usb_hid with on_key, for example:
#   on_key:
#     - key: F1
#       then: ...

external_components:
  - source:
      type: git
      url: https://github.com/p1ngb4ck/esphome
      ref: 9fb894738eb7db8cc642f7e08aad1e957cbaea60
    components: [hid]
  - source:
      type: git
      url: https://github.com/martijnbuts/usb
    components: [usb_host, lvgl_usb_hid, usb_hid]

# The fork's usb_host uses LOOP_TASK_CORE, a constant only the fork's esp32 core defines.
# Upstream ESPHome pins the loop task to core 1 as well.
esphome:
  build_flags:
    - -DLOOP_TASK_CORE=1

usb_host:
  # A hub may sit in between (keyboard, mouse, pad and a Bluetooth dongle all in one port)
  enable_hubs: true
  # Keyboards, mice, gamepads and most Bluetooth dongles are low/full-speed devices. Behind a
  # USB 2.0 hub they need split transactions, which espressif/usb (the USB host library ESP-IDF 6.1
  # uses) does not have: run the port at full speed when you use a hub.
  # Not needed for a combo receiver or a device directly in the port.
  # full_speed_only: true

# One entry for every HID device (keyboard, mouse, pad, receiver)
usb_hid:
  - id: usb_input
    layout: us
    device_name:
      name: "USB device"
      icon: mdi:usb
      entity_category: diagnostic

# One cursor and one keyboard focus for all of them
lvgl_usb_hid:
  - hid_id: usb_input
    hide_after: 10s
